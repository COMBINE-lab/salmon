[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# x86_64 + aarch64 on Linux and macOS; no Windows (salmon is unsupported there).
# The portable SIMD floor (x86-64-v2 / NEON) comes from .cargo/config.toml; the
# alignment kernel (ksw2rs) selects AVX2/SSE4.1/NEON at runtime regardless.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]

# dist 0.32 builds aarch64-apple-darwin on macos-14 by default; that image is
# retired on 2026-11-02 (actions/runner-images#13518). Pin the Apple Silicon
# build to macos-15. The binary's deployment target is unchanged (rustc's
# default for aarch64-apple-darwin, macOS 11).
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
