[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# x86_64 + aarch64 on Linux and macOS; no Windows (salmon is unsupported there).
# The portable SIMD floor (x86-64-v2 / NEON) comes from .cargo/config.toml; the
# alignment kernel (ksw2rs) selects AVX2/SSE4.1/NEON at runtime regardless.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]

# Build the Linux binaries inside manylinux_2_28 containers (glibc 2.28), so
# they run on RHEL/Rocky 8, Debian 10, Ubuntu 18.10 and newer — the GitHub
# runners' own glibc (2.35+) would otherwise become the minimum. glibc is
# linked dynamically, so on a newer host the binary uses that host's libc.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }
