[workspace]
resolver = "2"
members = [
    "crates/salmon-core",
    "crates/salmon-eqclass",
    "crates/salmon-infer",
    "crates/salmon-model",
    "crates/salmon-index",
    "crates/salmon-map",
    "crates/salmon-quant",
    "crates/salmon-cli",
    "crates/salmon-align",
    "crates/salmon-rad",
]

[workspace.package]
version = "2.4.1"
edition = "2021"
rust-version = "1.91"
license = "BSD-3-Clause"
repository = "https://github.com/COMBINE-lab/salmon"
authors = ["Rob Patro and the COMBINE-lab"]

# Shared dependency versions. Member crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
# internal salmon crates — path for local builds, version for `cargo publish`.
# bump_and_publish.sh bumps the shared [workspace.package] version, which flows here.
salmon-core = { path = "crates/salmon-core", version = "2.4.1" }
salmon-eqclass = { path = "crates/salmon-eqclass", version = "2.4.1" }
salmon-model = { path = "crates/salmon-model", version = "2.4.1" }
salmon-index = { path = "crates/salmon-index", version = "2.4.1" }
salmon-infer = { path = "crates/salmon-infer", version = "2.4.1" }
salmon-map = { path = "crates/salmon-map", version = "2.4.1" }
salmon-align = { path = "crates/salmon-align", version = "2.4.1" }
salmon-quant = { path = "crates/salmon-quant", version = "2.4.1" }
salmon-rad = { path = "crates/salmon-rad", version = "2.4.1" }
# error handling
thiserror = "2"
anyhow = "1"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# parallelism
rayon = "1"
crossbeam = "0.8"
crossbeam-channel = "0.5"
# concurrent map for equivalence classes
scc = "3"
dashmap = "6"
# fast (non-DoS-resistant) hasher for hot per-read integer-keyed maps
ahash = "0.8"
# numerics
statrs = "0.19"
# rng (PCG, matching salmon's pcg usage)
rand = "0.10"
rand_pcg = "0.10"
rand_distr = "0.6"
# hashing
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
# compression
flate2 = "1"
zstd = "0.13"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# cli
clap = { version = "4", features = ["derive"] }
# hashing of reference sequences/names for index provenance
sha2 = "0.11"
# COMBINE-lab dependencies, from crates.io.
cf1-rs = "0.5"
piscem-rs = "0.6.4"
# RAD-format I/O (chunk compression + backpatchable file tags); the `zstd`
# feature enables zstd-compressed RAD chunks (lz4 is always available).
libradicl = { version = "0.15", features = ["zstd"] }

# dev / test helpers
tempfile = "3"

# io / parsing (wired in later phases)
# paraseq, noodles-* added per-crate as phases land

# Workspace-wide lints. Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# This is array-heavy numeric code (EM/VBEM, bias splines, SAM flag math) where
# the loop index is routinely the value (a fragment length, transcript id, DP
# column) or indexes several parallel arrays at once. These lints fire constantly
# on idiomatic-for-the-domain code, so we allow them workspace-wide rather than
# scatter per-site `#[allow]`s.
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Like `release`, but keeps line-table debug info and does not strip, so
# `samply`/`cargo flamegraph` can attribute samples to functions/lines. The
# shipped `release`/`dist` binaries are unaffected (they stay stripped), and the
# same portable `target-cpu` floor from `.cargo/config.toml` still applies — we
# profile the binary users actually run. Build: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.bench]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# TEMPORARY (bucket-cache branch): build against local sshash-rs / piscem-rs
# checkouts carrying the bucket-bounds memoization. Cargo only honours a
# [patch] table from the workspace root, so piscem-rs's own patch section does
# not apply transitively and sshash-lib has to be redirected here as well.
# Revert to the published versions once the change is released.
[patch.crates-io]
piscem-rs = { path = "/scratch1/rob/alevin-fry-ecosystem/piscem-rs" }
sshash-lib = { path = "/scratch1/rob/alevin-fry-ecosystem/sshash-rs-dev/crates/sshash-lib" }
