[workspace]
resolver = "2"
members = [
    "crates/salmon-core",
    "crates/salmon-eqclass",
    "crates/salmon-infer",
    "crates/salmon-model",
    "crates/salmon-index",
    "crates/salmon-map",
    "crates/salmon-quant",
    "crates/salmon-cli",
    "crates/salmon-align",
    "crates/salmon-rad",
]

[workspace.package]
version = "2.6.0"
edition = "2021"
rust-version = "1.91"
license = "BSD-3-Clause"
repository = "https://github.com/COMBINE-lab/salmon"
authors = ["Rob Patro and the COMBINE-lab"]

# Shared dependency versions. Member crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
# internal salmon crates — path for local builds, version for `cargo publish`.
# bump_and_publish.sh bumps the shared [workspace.package] version, which flows here.
salmon-core = { path = "crates/salmon-core", version = "2.6.0" }
salmon-eqclass = { path = "crates/salmon-eqclass", version = "2.6.0" }
salmon-model = { path = "crates/salmon-model", version = "2.6.0" }
salmon-index = { path = "crates/salmon-index", version = "2.6.0" }
salmon-infer = { path = "crates/salmon-infer", version = "2.6.0" }
salmon-map = { path = "crates/salmon-map", version = "2.6.0" }
salmon-align = { path = "crates/salmon-align", version = "2.6.0" }
salmon-quant = { path = "crates/salmon-quant", version = "2.6.0" }
salmon-rad = { path = "crates/salmon-rad", version = "2.6.0" }
# error handling
thiserror = "2"
anyhow = "1"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# parallelism
rayon = "1"
crossbeam = "0.8"
crossbeam-channel = "0.5"
# concurrent map for equivalence classes
dashmap = "6"
# fast (non-DoS-resistant) hasher for hot per-read integer-keyed maps
ahash = "0.8"
# raw hash table, for caches that must probe with a borrowed key (no key
# allocation on a lookup that hits)
hashbrown = "0.17"
# numerics
statrs = "0.19"
# rng (PCG, matching salmon's pcg usage)
rand = "0.10"
rand_pcg = "0.10"
rand_distr = "0.6"
# hashing
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
# compression
flate2 = { version = "1", features = ["zlib-rs"] }
zstd = "0.13"
# format-sniffing decompression (gzip/BGZF, bzip2, xz, zstd) for user-supplied
# annotation files; already in the tree via paraseq and piscem-rs.
niffler = "3"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# cli
clap = { version = "4", features = ["derive"] }
# hashing of reference sequences/names for index provenance
sha2 = "0.11"
# COMBINE-lab dependencies, from crates.io.
cf1-rs = "0.5"
# 0.9.0 brings the adaptive thread broker: `-t` becomes a single execution-slot
# budget shared between gzip decoding and mapping, solved from live measurement
# rather than split by a fixed guess. `rapidgzip` enables the parallel decoder
# that budget is worth dividing in the first place.
piscem-rs = { version = "0.10.0", features = ["rapidgzip"] }
# The control law piscem-rs 0.9.0 is built on. Taken directly so salmon can
# implement `Consumer` for its own mapping pool; must resolve to the same
# version piscem-rs uses or the trait would not match across the boundary.
thread-broker = "0.1.0"
# Named directly only to hold the decoder pool for the run's lifetime; the
# decoding itself is driven through piscem-rs. Must match the version piscem-rs
# resolves, or the pool handed to `open_input_pooled` would be a different type.
rapidgzip-core = "0.3"
# RAD-format I/O (chunk compression + backpatchable file tags); the `zstd`
# feature enables zstd-compressed RAD chunks (lz4 is always available).
libradicl = { version = "0.18", features = ["zstd"] }

# dev / test helpers
tempfile = "3"
# benchmark harness: runs each case to a time budget and reports the
# distribution, rather than one wall-clock average per run.
divan = "0.1"

# io / parsing
# TEMPORARY: a republication of paraseq's released 0.5.0 plus the resizable
# worker pool offered upstream as noamteyssier/paraseq#78 (fixed spawn set with
# parking; worker count bounded by construction). `ThreadPool` is what lets the
# mapping thread count change mid-run, which the broker requires. `paraseq` is
# the official crate -- move back once the pool lands there. Must match what
# piscem-rs resolves, or two paraseq copies end up either side of its API.
#
# Declared under its real name rather than renamed to `paraseq`: the rename was
# never needed (the crate's library target is itself named `paraseq`, so
# `use paraseq::...` works either way) and it made the dependency invisible to
# tooling. Dependabot's cargo parser skips a renamed manifest entry outright
# (`next unless name == name_from_declaration(...)`), so this crate reached it
# only through Cargo.lock, as an indirect dependency no version update would
# ever be raised for.
paraseq-temp = "0.5.0-pre.2"

# Workspace-wide lints. Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# This is array-heavy numeric code (EM/VBEM, bias splines, SAM flag math) where
# the loop index is routinely the value (a fragment length, transcript id, DP
# column) or indexes several parallel arrays at once. These lints fire constantly
# on idiomatic-for-the-domain code, so we allow them workspace-wide rather than
# scatter per-site `#[allow]`s.
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Like `release`, but keeps line-table debug info and does not strip, so
# `samply`/`cargo flamegraph` can attribute samples to functions/lines. The
# shipped `release`/`dist` binaries are unaffected (they stay stripped), and the
# same portable `target-cpu` floor from `.cargo/config.toml` still applies — we
# profile the binary users actually run. Build: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.bench]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

