name: Docker image

# Build and publish the salmon container image on every release tag (so the
# published image never lags a release again — see #1040), and on demand via
# "Run workflow".
#
# Each architecture is built on a NATIVE runner (amd64 on ubuntu-22.04, arm64 on
# ubuntu-22.04-arm) and pushed to GHCR by digest; a merge job then assembles the
# multi-arch manifest and copies it to Docker Hub. Native arm64 avoids the very
# slow / occasionally-wedging QEMU-emulated build.
#
# Publishes:
#   - GHCR:       ghcr.io/combine-lab/salmon   (built-in GITHUB_TOKEN, always)
#   - Docker Hub: combinelab/salmon            (requires DOCKERHUB_USERNAME /
#                                               DOCKERHUB_TOKEN repo secrets)
#
# To refresh an already-released version without cutting a new salmon release:
# Actions -> "Docker image" -> Run workflow (on the default branch). Image tags
# are derived from the [workspace.package] version in Cargo.toml.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/combine-lab/salmon
  DOCKERHUB_IMAGE: combinelab/salmon

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build this single platform natively and push it to GHCR by digest (no
      # tag yet — the merge job assembles the tagged multi-arch manifest).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No provenance/SBOM attestation manifests — keep the final multi-arch
          # index to exactly linux/amd64 + linux/arm64 (no "unknown/unknown"
          # entries on the registry tag listing).
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4 # for Cargo.toml (image version)

      - name: Image version (from Cargo.toml)
        id: ver
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -1)
          [ -n "$v" ] || { echo "::error::could not read [workspace.package] version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      - name: Docker Hub configured?
        id: targets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_TOKEN not set — publishing to GHCR only. Add DOCKERHUB_USERNAME/DOCKERHUB_TOKEN to also push combinelab/salmon."
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Assemble the tagged multi-arch manifest on GHCR from the per-arch
      # digests, then copy the whole thing (manifest + blobs) to Docker Hub.
      - name: Create and push multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          VER: ${{ steps.ver.outputs.version }}
          MINOR: ${{ steps.ver.outputs.minor }}
          DOCKERHUB: ${{ steps.targets.outputs.dockerhub }}
        run: |
          set -euo pipefail
          src=$(printf "${GHCR_IMAGE}@sha256:%s " *)
          echo "Assembling GHCR manifest from: $src"
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${VER}" -t "${GHCR_IMAGE}:${MINOR}" -t "${GHCR_IMAGE}:latest" \
            $src
          if [ "$DOCKERHUB" = "true" ]; then
            echo "Copying manifest to Docker Hub"
            docker buildx imagetools create \
              -t "${DOCKERHUB_IMAGE}:${VER}" -t "${DOCKERHUB_IMAGE}:${MINOR}" -t "${DOCKERHUB_IMAGE}:latest" \
              "${GHCR_IMAGE}:${VER}"
          fi

      - name: Inspect published image
        run: docker buildx imagetools inspect "${GHCR_IMAGE}:${{ steps.ver.outputs.version }}"
