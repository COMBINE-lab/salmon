[package]
name = "salmon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared core types for the Rust port of salmon (transcripts, library formats, log-space math)."

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
# the unmatched-transcript list under aux_info/ is JSON, like the other
# non-primary artifacts salmon writes there
serde_json = { workspace = true }
tracing = { workspace = true }
# transparent decompression of compressed --geneMap annotations
niffler = { workspace = true }

# statvfs, for the free-disk-space probe behind the RAD-intermediate
# preflight/low-space checks (unix only; the probe reports None elsewhere)
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[lints]
workspace = true

[dev-dependencies]
flate2 = { workspace = true }
zstd = { workspace = true }
tempfile = { workspace = true }
