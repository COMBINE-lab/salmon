[package]
name = "salmon-align"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Alignment-based (BAM) quantification for the salmon Rust port."

[dependencies]
salmon-core = { workspace = true }
salmon-eqclass = { workspace = true }
salmon-infer = { workspace = true }
salmon-model = { workspace = true }
salmon-rad = { workspace = true }
libradicl = { workspace = true }
crossbeam-queue = "0.3"
noodles-bam = "0.90"
noodles-sam = "0.85"
noodles-bgzf = "0.47"
# Genome-alignment projection (spliced genome BAM -> transcriptome coords). Its
# public API is plain structs, so it composes with salmon's own noodles for BAM
# reading. bramble-rs is on the same noodles 0.111 (sam 0.85 etc.) + ksw2rs 0.2.0
# as salmon, so the graph carries a single version of each (see the workspace
# [patch.crates-io] for the temporary bramble/libradicl git pins).
bramble-rs = "0.1.4"
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
flate2 = { workspace = true }
jiff = "0.2"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
