[package]
name = "salmon-align"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Alignment-based (BAM) quantification for the salmon Rust port."

[dependencies]
salmon-core = { workspace = true }
salmon-eqclass = { workspace = true }
salmon-infer = { workspace = true }
salmon-model = { workspace = true }
salmon-rad = { workspace = true }
libradicl = { workspace = true }
crossbeam-queue = "0.3"
noodles-bam = "0.92"
noodles-sam = "0.87"
noodles-bgzf = "0.49"
# Genome-alignment projection (spliced genome BAM -> transcriptome coords). Its
# public API is plain structs, so it composes with salmon's own noodles for BAM
# reading. bramble-rs 0.1.6 is on the same noodles 0.111 (sam 0.85 etc.) + ksw2rs
# 0.2.0 as salmon (and libradicl 0.14.2), so the graph carries a single version
# of each. (0.1.5 was yanked upstream; 0.1.6 is the current non-yanked release.)
bramble-rs = "0.1.6"
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
flate2 = { workspace = true }
jiff = "0.2"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
