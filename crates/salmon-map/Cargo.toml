[package]
name = "salmon-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Selective-alignment mapping for the salmon Rust port: MEM collection, chaining, and alignment validation."

[dependencies]
salmon-core = { path = "../salmon-core" }
piscem-rs = { workspace = true }
sshash-lib = "0.6"
ahash = { workspace = true }
# ksw2 (the alignment backend): a native-Rust ksw_extz2_sse port with runtime
# SIMD dispatch (AVX2/SSE4.1/NEON + scalar fallback) — one portable binary.
# Local checkout during development; swap to a crates.io version at release.
ksw2rs = { path = "../../../ksw2rs" }

[dev-dependencies]
salmon-index = { path = "../salmon-index" }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "warn"
