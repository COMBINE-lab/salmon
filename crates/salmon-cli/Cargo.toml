[package]
name = "salmon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for the salmon Rust port."

[[bin]]
name = "salmon"
path = "src/main.rs"

[dependencies]
salmon-core = { workspace = true }
mimalloc = "0.1"
rayon = { workspace = true }
salmon-index = { workspace = true }
salmon-quant = { workspace = true }
salmon-align = { workspace = true }
salmon-map = { workspace = true }
piscem-rs = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = "0.18"

[features]
# Diagnostic: build with the system allocator instead of mimalloc. See
# src/global_alloc.rs for how the choice is made and docs/allocator-choice.md
# for what would have to be measured to change it.
sysalloc = []

[dev-dependencies]
tempfile = { workspace = true }
flate2 = { workspace = true }
# meta_info.json assertions in the metadata-truth tests: parse the field set
# rather than substring-matching it, so a renamed field fails loudly.
serde_json = { workspace = true }

[lints]
workspace = true
