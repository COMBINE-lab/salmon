[package]
name = "salmon-infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Collapsed EM / VBEM abundance estimation over equivalence classes for the salmon Rust port."

[dependencies]
salmon-core = { workspace = true }
salmon-eqclass = { workspace = true }
statrs = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
rand_distr = { workspace = true }
# Experimental GPU warm start of the EM; `build.rs` picks the backend. `cuda`
# needs CUDA >= 13.0 headers at build time (cuda-bindings runs bindgen).
tracing = { workspace = true, optional = true }
cutile = { version = "0.5.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

# `rocm` opens libamdhip64/libhiprtc at run time, so it builds without ROCm.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.8", optional = true }

[features]
# Metal is used on macOS only and ROCm on Linux only (no-ops elsewhere).
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal", "dep:tracing"]
cuda = ["dep:cutile", "dep:tracing"]
rocm = ["dep:libloading", "dep:tracing"]

[dev-dependencies]
# Bench harness for the EM/VBEM convergence loop (dev-only; no shipping impact).
# `profile.bench` already carries thin-LTO. Used by `benches/em_step.rs`.
criterion = "0.8"

[[bench]]
name = "em_step"
harness = false

[lints]
workspace = true
