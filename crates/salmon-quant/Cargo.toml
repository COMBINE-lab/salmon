[package]
name = "salmon-quant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reads-mode quantification driver for the salmon Rust port (FASTQ -> mapping -> EM -> quant.sf)."

[dependencies]
salmon-core = { workspace = true }
salmon-index = { workspace = true }
salmon-map = { workspace = true }
salmon-model = { workspace = true }
salmon-eqclass = { workspace = true }
salmon-infer = { workspace = true }
salmon-rad = { workspace = true }
piscem-rs = { workspace = true }
paraseq-temp = { workspace = true }
# Annotation parsing for the spliced genome output: exon structures per
# transcript, so a transcriptome alignment can be cut at exon boundaries and
# reported in genome coordinates. Same crate salmon-align already uses for the
# opposite (genome -> transcriptome) direction, kept at one version.
bramble-rs = "0.1.8"
thread-broker = { workspace = true }
rapidgzip-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
noodles-bgzf = "0.51"
jiff = "0.2"
# @SQ M5: the MD5 of each reference sequence. It is what binds a BAM to the
# exact reference it was made against, and what CRAM needs to reconstruct bases.
md-5 = "0.11"

[dev-dependencies]
tempfile = { workspace = true }
noodles-bam = "0.94"
noodles-sam = "0.89"
# reading back RAD output in the end-to-end test
libradicl = { workspace = true }

[lints]
workspace = true
