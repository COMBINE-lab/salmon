<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
<title id="title">Deterministic EM speedup by thread count</title>
<desc id="desc">Two line charts compare baseline and selected 128-shard candidate T1 over Tp speedup on the local EPYC and newton Xeon hosts. The candidate is faster at every multi-thread count and peaks at 10.3 times locally and 9.44 times on newton at 32 threads.</desc>
<rect width="1040" height="430" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.grid{stroke:#d8dee4;stroke-width:1}.frame{stroke:#57606a;stroke-width:1;fill:none}.base{stroke:#57606a;fill:none;stroke-width:2.5}.cand{stroke:#cf4f00;fill:none;stroke-width:3}.base-dot{fill:#57606a}.cand-dot{fill:#cf4f00}</style>
<text x="520" y="28" text-anchor="middle" font-size="18" font-weight="600">EM speedup from five-run medians</text>
<line x1="390" y1="50" x2="420" y2="50" class="base"/><circle cx="405" cy="50" r="3.5" class="base-dot"/><text x="428" y="54" font-size="12">#1169 baseline</text>
<line x1="550" y1="50" x2="580" y2="50" class="cand"/><circle cx="565" cy="50" r="4" class="cand-dot"/><text x="588" y="54" font-size="12">selected candidate</text>
<text x="312" y="76" text-anchor="middle" font-size="14" font-weight="600">Local · 2× EPYC 9575F</text>
